name: CI - RTPLAN
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    name: Python matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[test,ui]'
      - name: Compile Python sources
        run: python -m compileall -q src app.py
      - name: Tests
        run: python -m pytest -q

  web-tests:
    name: JavaScript synthetic MCSv tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check web/complexity.js
      - name: Reference synthetic metric cases
        run: node --test web/test_complexity.cjs web/test_ui.cjs
