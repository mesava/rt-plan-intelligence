[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rt-plan-intelligence"
version = "0.2.0"
description = "Research-only RTPLAN MLC geometry and complexity analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pydicom>=2.4,<4", "pandas>=2.0,<3"]

[project.optional-dependencies]
ui = ["streamlit>=1.32,<2", "plotly>=5.20,<7"]
test = ["pytest>=7,<10"]

[project.scripts]
rtpi = "rtpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
